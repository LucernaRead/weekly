name: lint

# Structure problems (an invalid pair, a PDF hash mismatch, index drift, a complete week without its website cover)
# usually show up only at run time on the consumer side, so block them before the merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # lint.mjs has zero dependencies; the runner's own node is enough. The content repo does not pull in npm.
      - run: node lint.mjs
