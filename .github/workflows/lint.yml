name: lint

# Structure problems (an invalid pair, a PDF hash mismatch, index drift, a complete week without its website cover)
# usually show up only at run time on the consumer side, so block them before the merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Rule 4 runs pdftotext on every PDF. The ubuntu-latest image no longer ships it
      # (every run from 2026-11-03 failed with "needs pdftotext"), so install poppler first.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      # lint.mjs has zero dependencies; the runner's own node is enough. The content repo does not pull in npm.
      - run: node lint.mjs
