<div class="page">
  <div class="frame">
    <div class="head-row"><span class="brand">The Lucerna</span><span class="sec">每日一句周报 · 第一周 (二)</span></div>

    <div class="day">
      <div class="day-label"><span class="no">No.003 · 10月17日 周六</span><span class="book">拉封丹《寓言》</span></div>
      <div class="quote">« Petit poisson deviendra grand. »</div>
      <div class="grammar"><b>语法点</b>｜<b>deviendra</b> 是 devenir 的简单将来时:「将会变成」。小鱼出自《小鱼与渔夫》。</div>
      <div class="trans"><span class="k">译文</span>小鱼会长成大鱼。</div>
    </div>

    <div class="day">
      <div class="day-label"><span class="no">No.004 · 10月18日 周日</span><span class="book">大仲马《基督山伯爵》</span></div>
      <div class="quote">« Attendez et espérez ! »</div>
      <div class="grammar"><b>语法点</b>｜这是<b>祈使句</b>:对 vous 说话时去掉 vous,直接用动词作叮嘱。原书结尾,伯爵留给世人的话。</div>
      <div class="trans"><span class="k">译文</span>等待,希望吧!</div>
    </div>

    <div class="foot"><span>每日一句 · 周报 VOL.1</span><span>3 / 5</span></div>
  </div>
